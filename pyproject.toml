[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intentguard"
version = "0.1.0"
description = "Research prototype for task-scoped runtime authorization in tool-using agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]

